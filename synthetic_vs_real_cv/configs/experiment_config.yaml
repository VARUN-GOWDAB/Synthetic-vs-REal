project:
  title: "Evaluating the Effectiveness of Synthetic Data for Real-World Object Detection"
  objective: "Measure whether synthetic data can reduce required real-world data while preserving real-world performance."
  evaluation_policy: "All experiments are evaluated on the same unseen real-world test set."

real_dataset:
  source: "Safety Helmet Wearing Dataset (SHWD) as the primary real-data candidate; verify exact license and class distribution before final use."
  dataset_license: "Check the official dataset license before final experiment execution."
  classes:
    - worker
    - helmet
  split_strategy: "Group by video, camera, location, or near-duplicate scene before splitting to avoid leakage."
  val_ratio: 0.15
  test_ratio: 0.15
  data_quality_check:
    - object visibility
    - annotation consistency
    - class balance
    - image diversity
    - legal academic use

synthetic_dataset:
  generator: "Blender Python + domain randomization"
  target_images: 1000
  render_resolution: "640x640 or 1024x1024, chosen consistently across all experiments"
  scene_types:
    - warehouse
    - factory_floor
    - loading_bay
    - assembly_line
  diversity_requirements:
    - camera_position
    - camera_angle
    - object_scale
    - worker_pose
    - helmet_position
    - background_variation
    - lighting_variation
    - shadows
    - occlusion
    - clutter
  annotation_method: "Automated bounding box export from Blender metadata or camera-projection logic"
  realism_target: "medium realism with strong scene variation, not ultra-photorealistic rendering"

experiments:
  - name: "100_real"
    real_ratio: 1.0
    synthetic_ratio: 0.0
  - name: "75_real_25_synthetic"
    real_ratio: 0.75
    synthetic_ratio: 0.25
  - name: "50_real_50_synthetic"
    real_ratio: 0.5
    synthetic_ratio: 0.5
  - name: "25_real_75_synthetic"
    real_ratio: 0.25
    synthetic_ratio: 0.75
  - name: "100_synthetic"
    real_ratio: 0.0
    synthetic_ratio: 1.0

model:
  architecture: "YOLOv8 or YOLOv11 depending on availability and hardware"
  family: "YOLO"
  selection_reason: "Modern single-stage detector with strong real-time performance, mature training tooling, and broad reproducibility."
  model_size: "[small/medium/large, selected after pilot test]"
  input_resolution: "[640 or 1280, chosen consistently across experiments]"
  epochs: "[selected during pilot; keep fixed across all ratios]"
  batch_size: "[selected during pilot; keep fixed across all ratios]"
  learning_rate: "[kept constant across experiments]"
  optimizer: "AdamW or SGD, chosen consistently"
  augmentation: "Same augmentation policy across all experiments"
  seed_policy: "Repeat runs with at least 3 seeds when feasible"

training:
  hardware: "[GPU model]"
  software_environment: "[CUDA version, Python version, Ultralytics version, OS]"
  fixed_variables:
    - architecture
    - epochs
    - batch_size
    - image_resolution
    - optimizer
    - augmentation policy
    - evaluation set
    - metrics

metrics:
  required:
    - mAP
    - precision
    - recall
    - AP_per_class
  optional:
    - mAP50
    - mAP50_95
    - F1
    - inference_time
    - false_positives
    - false_negatives

analysis:
  overall_performance: "Synthetic-data percentage versus detection quality"
  per_class_performance: "Class-specific changes as synthetic ratio increases"
  error_analysis: "False positives, misses, small objects, occlusion, lighting, and domain mismatch"
  domain_gap: "Compare synthetic vs real image statistics and sampled qualitative examples"

reproducibility:
  dataset_version: "[record exact dataset commit or manifest]"
  image_counts: "[record per split and per experiment]"
  class_distribution: "[record per training split]"
  synthetic_generation_parameters: "[store generation manifest]"
  model_version: "[YOLO checkpoint identifier]"
  random_seed: "[record for every run]"
  hardware: "[GPU model, CPU, RAM]"
  software_versions: "[python, torch, ultralytics, CUDA, OS]"
